# 项目根目录/build.yaml
targets:
  $default:
    builders:
      # injectable 只扫描业务代码目录
      injectable_generator:injectable_config_builder:
        generate_for:
          - lib/core/**
          - lib/features/**
          - lib/domain/**
          - lib/shared/**
          - lib/data/**
          # ❌ 不包含: lib/src/rust/**

      injectable_generator:injectable_builder:
        generate_for:
          - lib/core/**
          - lib/features/**
          - lib/domain/**
          - lib/shared/**
          - lib/data/**

      # 其他生成器同理（如果需要）
      drift_dev:
        generate_for:
          - lib/domain/**
          - lib/data/**
          - lib/core/**

      retrofit_generator:
        generate_for:
          - lib/features/**/api/**