# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # 代码风格
    - prefer_single_quotes        # 优先使用单引号
    - require_trailing_commas     # 要求尾随逗号
    #- sort_pub_de@pendencies       # 排序 pub 依赖
    - prefer_final_locals         # 局部变量优先使用 final
    - prefer_const_constructors   # 优先使用 const 构造函数
    - prefer_const_literals_to_create_immutables
    - avoid_print                 # 禁止使用 print

    # 错误预防
    - avoid_empty_else            # 避免空的 else
    - empty_catches               # catch 块为空时需要注释
    - no_duplicate_case_values    # 避免重复的 case 值
    - valid_regexps               # 正则表达式必须有效

    # 最佳实践
    - prefer_is_empty             # 优先使用 .isEmpty 而非 .length == 0
    - prefer_is_not_empty         # 优先使用 .isNotEmpty 而非 .length != 0
    - prefer_contains             # 优先使用 .contains 而非 .indexOf

    # 代码组织
    #- lines_longer_than_80_chars  # 行长度超过 80 字符时提醒
    #- sort_constructors_first     # 构造函数排在前面
    - unawaited_futures           # 未 await 的 Future 需要标记

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - '**/*.config.dart'
    - 'rust_builder/**'
    - '.qwen/**'
    - '.trae/**'
    - '.iflow/**'
    - 'lib/src/**'

  errors:
    # 将某些 lint 规则升级为错误
    avoid_print: error
    prefer_const_constructors: warning
    prefer_final_locals: info
    unawaited_futures: warning
