# Zephyr Reader 配置文件示例
# 复制此文件为 config.toml 并根据需要修改

# ==================== 解析器配置 ====================
[parser]
# 是否启用并行解析（多章节同时处理）
enable_parallel = true
# 并行处理的线程数（0 表示使用 CPU 核心数）
parallel_threads = 0
# 默认编码（utf-8, gbk, big5 等）
default_encoding = "utf-8"
# 是否验证章节内容
validate_chapters = true

# ==================== 缓存配置 ====================
[cache]
# 是否启用缓存
enabled = true
# 最大缓存条目数
max_entries = 100
# 最大内存占用（MB）
max_memory_mb = 50
# 缓存过期时间（秒），0 表示永不过期
ttl_seconds = 3600

# ==================== 搜索配置 ====================
[search]
# 索引块大小（字符数）
index_chunk_size = 500
# 搜索结果摘要长度（字符数）
snippet_length = 100
# 最大搜索结果数
max_results = 50

# ==================== 性能配置 ====================
[performance]
# 是否启用性能指标收集
enable_metrics = true
# 是否记录慢操作日志
log_slow_operations = true
# 慢操作阈值（毫秒）
slow_threshold_ms = 100
