[package]
name = "rust_lib_zephyr_reader"
version = "0.1.0"
edition = "2021"
description = "Zephyr Reader - High-performance bilingual text parsing engine"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# FFI bridge
flutter_rust_bridge = "=2.11.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# EPUB parsing (2.x API changed significantly)
epub = "2.1.5"

# PDF parsing
pdf = "0.9"
pdfium-render = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# HTML parsing for rich text support
html5ever = "0.39"
markup5ever_rcdom = "0.38"

# Encoding detection and conversion
encoding_rs = "0.8.35"
chardetng = "0.1.17"

# Text processing
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.12.0"

# Error handling
thiserror = "2.0.18"
anyhow = "1.0"

# Logging
log = "0.4.29"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# UUID
uuid = { version = "1.22.0", features = ["v4"] }

# Date and time
chrono = "0.4.44"

# Lazy initialization
lazy_static = "1.5.0"
once_cell = "1.21"

# Regex
regex = "1.12.3"

# Parallel processing
rayon = "1.11.0"

# Async runtime
tokio = { version = "1.50.0", features = ["full"] }

# Memory mapping
memmap2 = "0.9.10"

# Hyphenation
hyphenation = { version = "0.8.4", features = ["embed_en-us"] }

# Chinese text segmentation (used in search module)
jieba-rs = "0.8.1"

# SQLite for full-text search (仅用于搜索索引，可重建的临时数据)
# 如果不需要搜索功能，可以注释掉
rusqlite = { version = "0.31", features = ["bundled"] }

# Configuration
toml = "0.8"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3.27.0"

[[bench]]
name = "parsing_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
