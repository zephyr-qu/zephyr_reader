[package]
name = "rust_lib_zephyr_reader"
version = "0.1.0"
edition = "2024"
description = "Zephyr Reader - High-performance bilingual text parsing engine"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# FFI bridge
flutter_rust_bridge = { version = "=2.12.0", features = ["chrono","log"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# EPUB parsing (2.x API changed significantly)
epub = "2.1.5"

# PDF parsing
pdfium-render = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# HTML parsing for rich text support
html5ever = "0.39"
markup5ever_rcdom = "0.39.0"

# Encoding detection and conversion
encoding_rs = "0.8.35"
chardetng = "1.0.0"

# Text processing
unicode-segmentation = "1.13.2"

# Error handling
thiserror = "2.0.18"
anyhow = "1.0.102"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# UUID
uuid = { version = "1.23.1", features = ["v4"] }

# MD5 for stable hash
md5 = "0.8.0"

# Date and time
chrono = {version ="0.4.44",features = ["serde"]}

# Platform-appropriate directories
dirs = "6.0"

once_cell = "1.20"
lru = "0.18.0"

# Regex
regex = "1.12.3"

# Efficient synchronization primitives
parking_lot = "0.12.5"

# Async runtime
tokio = { version = "1.52.3", features = [
  "rt-multi-thread",    # 多线程运行时
    "macros",             # 宏支持
    "sync",               # 同步原语
    "time",               # 定时器
    ] }
# Memory mapping
memmap2 = "0.9.10"

# Hyphenation
hyphenation = { version = "0.8.4", features = ["embed_en-us"] }

# Markdown parsing (GFM tables, footnotes)
comrak = "0.52.0"

# Chinese text segmentation (used in search module)
jieba-rs = "0.10.1"

# Async SQL toolkit
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",      # 使用 tokio 运行时
    "tls-rustls",         # 使用纯 Rust TLS
    "sqlite",             # 启用 SQLite 支持
    "chrono",             # 启用日期时间类型支持
    "migrate",            # 用于数据库迁移
    "macros",             # 启用编译时 SQL 检查
    "derive",             # 启用 FromRow 派生宏，简化代码
    "uuid",               # 如果用到 UUID 主键
] }

# MDict dictionary format parser
rs-mdict = "0.1.1"

# KV storage for layout cache
sled = "0.34.7"

strum = { version = "0.27", features = ["derive"] }
itertools = "0.14"

# Binary serialization
bincode = "2.0"
# Fast deterministic hashing for cache keys
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[package.metadata.hyphenation]
embeds = ["EnglishUS"]

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
pretty_assertions = "1.4"
tempfile = "3.27.0"

[[bench]]
name = "parsing_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = 'abort'

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
