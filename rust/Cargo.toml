[package]
name = "rust_lib_zephyr_reader"
version = "0.1.0"
edition = "2021"
description = "Zephyr Reader - High-performance bilingual text parsing engine"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# FFI bridge
flutter_rust_bridge = { version = "=2.12.0", features = ["chrono"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }

# EPUB parsing (2.x API changed significantly)
epub = "2.1.5"

# PDF parsing (使用 pdfium-render 替代过旧的 pdf crate)
pdfium-render = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# HTML parsing for rich text support
html5ever = "0.39"
markup5ever_rcdom = "0.39.0"

# Encoding detection and conversion
encoding_rs = "0.8.35"
chardetng = "1.0.0"

# Text processing
unicode-segmentation = "1.13.2"

# Error handling
thiserror = "2.0.18"
anyhow = "1.0.102"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# UUID
uuid = { version = "1.23.1", features = ["v4"] }

# MD5 for stable hash
md5 = "0.8.0"

# Date and time
chrono = { version = "0.4.44", features = ["serde"] }

# Platform-appropriate directories
dirs = "6.0"

# Async trait support
async-trait = "0.1"

# Lazy initialization
once_cell = "1.21.4"
lru = "0.18.0"

# Regex
regex = "1.12.3"

# Parallel processing
rayon = "1.12.0"

# Efficient synchronization primitives
parking_lot = "0.12.5"

# Async runtime
tokio = { version = "1.52.3", features = ["full"] }
# Memory mapping
memmap2 = "0.9.10"

# Hyphenation
hyphenation = { version = "0.8.4", features = ["embed_en-us"] }

# Chinese text segmentation (used in search module)
jieba-rs = "0.9.0"

# Async SQL toolkit
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "chrono", "migrate"] }

# KV storage for layout cache
sled = "0.34.7"

# Binary serialization
bincode = "1.3"

[package.metadata.hyphenation]
embeds = ["EnglishUS"]

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3.27.0"

[[bench]]
name = "parsing_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
