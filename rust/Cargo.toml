[package]
name = "rust_lib_zephyr_reader"
version = "0.1.0"
edition = "2021"
description = "Zephyr Reader - High-performance bilingual text parsing engine"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# FFI bridge
flutter_rust_bridge = "=2.11.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# EPUB parsing
epub = "1.2"

# Encoding detection and conversion
encoding_rs = "0.8"
chardetng = "0.1"

# Text processing
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.11"

# Error handling
thiserror = "1.0"

# Logging
log = "0.4"

# UUID
uuid = { version = "1.0", features = ["v4"] }

# Regex and lazy initialization
regex = "1.10"
once_cell = "1.19"

# Parallel processing
rayon = "1.10"

# Memory mapping
memmap2 = "0.9"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }