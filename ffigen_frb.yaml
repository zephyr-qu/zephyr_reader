ffigen:
  name: FlutterRustBridgeFFI
  output: 'lib/src/ffi/generated_bindings.dart'
  headers:
    entry-points:
      - 'rust_target/cbindgen_temp.h'  # frb 会自动生成
  llvm-path:
    - 'D:/app/scoop/apps/llvm/current'  # ← 关键！
  compiler-opts:
    - '-IF:/App/zephyr_reader/rust_target'
  include-directives:
    - '**'