name: zephyr_reader
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.1
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
    # --- Routing ---
  go_router: ^17.0.1

  # --- State Management ---
  signals_flutter: ^7.1.0
  signals_hooks: ^7.1.0
  flutter_hooks: ^0.21.3+1

  # --- Dependency Injection ---
  get_it: ^9.2.0
  injectable: ^3.0.0

  # --- Network & API ---
  dio: ^5.9.0

  # --- Data & Persistence ---
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.0.0
  path_provider: ^2.1.3
  path: ^1.9.0
  webdav_client: ^1.2.2
  flutter_tts: ^4.2.5

  # --- UI & Assets ---
  line_icons: ^2.0.0
  flutter_animate: ^4.5.2
  flutter_svg: ^2.2.3
  fl_chart: ^1.2.0
  file_picker: ^12.0.0-beta.5
  battery_plus: ^7.0.0
  url_launcher: ^6.3.1

  # --- Utils & Others ---
  logger: ^2.6.2
  json_annotation: ^4.11.0
  freezed_annotation: ^3.1.0
  uuid: ^4.5.2
  package_info_plus: ^10.1.0

  rust_lib_zephyr_reader:
    path: rust_builder
  flutter_rust_bridge: 2.12.0
  intl: ^0.20.2

  # --- Dictionary ---
  flutter_widget_from_html_core: ^0.17.2
  audioplayers: ^6.1.0
  # --- Async Utilities ---
  async: ^2.13.0
  phosphoricons_flutter: 1.0.0
  shimmer: ^3.0.0
  flureadium: ^0.13.2

  # --- Error Reporting ---
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  ffigen: ^20.1.1

  # --- Code Generation ---
  build_runner: ^2.4.14
  json_serializable: ^6.9.3
  injectable_generator: ^3.0.2
  integration_test:
    sdk: flutter
  freezed: ^3.2.5
  mocktail: ^1.0.4
  test: ^1.29.0
  dart_mcp: ^0.5.1
flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/dictionary.mdx


  fonts:
    - family: Noto Serif SC
      fonts:
        - asset: assets/fonts/NotoSerifSC-Regular.ttf
          weight: 400