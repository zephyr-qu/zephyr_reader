appId: com.zephyr.reader
# 前提：设备 locale=en（断言为英文文案；中文设备 flow 会失败，真机验证后再统一）。
---
- launchApp:
      stopApp: false
- extendedWaitUntil:
      visible: "Home"
      timeout: 20000
- tapOn: "Stats"
- extendedWaitUntil:
      visible: "Statistics"
      timeout: 10000
- assertVisible: "Today"
- assertVisible: "Week"
- assertVisible: "Month"
- assertVisible: "Year"
- assertVisible: ".*Reading Heatmap.*"
