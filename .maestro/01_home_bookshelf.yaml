appId: com.zephyr.reader
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Home"
    timeout: 20000
- tapOn: "Home"
- extendedWaitUntil:
    visible: "Continue Reading"
    timeout: 20000
- tapOn: "Bookshelf"
- waitForAnimationToEnd
- assertVisible: "Bookshelf"
- assertVisible: "All"
- assertVisible: "Unread"
- assertVisible: "Reading"
- assertVisible: "Finished"
- assertVisible: "Import"
