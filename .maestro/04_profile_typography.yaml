appId: com.zephyr.reader
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Home"
    timeout: 20000
- tapOn: "Profile"
- extendedWaitUntil:
    visible: "Reading History"
    timeout: 10000
- tapOn: "Typography"
- extendedWaitUntil:
    visible: ".*Live Preview.*"
    timeout: 10000
- assertVisible: "Typography"
- assertVisible: "Font Family"
- scrollUntilVisible:
    element: ".*Font Size.*"
    direction: DOWN
    timeout: 10000
- assertVisible: ".*Font Size.*"
