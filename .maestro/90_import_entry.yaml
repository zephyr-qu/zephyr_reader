appId: com.zephyr.reader
# 前提：设备 locale=en（断言为英文文案；中文设备 flow 会失败，真机验证后再统一）。
---
- launchApp:
    stopApp: false
- runFlow:
    when:
      visible: "Typography"
    commands:
      - pressKey: Back
- extendedWaitUntil:
    visible: "Home"
    timeout: 20000
- tapOn: "Bookshelf"
- extendedWaitUntil:
    visible: "Import"
    timeout: 10000
- tapOn: "Import"
- extendedWaitUntil:
    visible: "Recent"
    timeout: 10000
- assertVisible: "No items"
